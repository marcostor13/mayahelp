name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URI: mongodb://localhost:27017/mayahelp
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: https://localcoolify.marcostorresalarcon.com
      COOLIFY_BACKEND_UUID: pry79jef5nh089mluu36l41m
      COOLIFY_FRONTEND_UUID: v8fkhe77hmvjsii970qgschv
    steps:
      # Un solo paso para los dos recursos: con un paso por app, si el primero falla el
      # segundo queda "skipped" y el frontend no se despliega por un problema del backend.
      - name: Trigger Coolify deploys
        env:
          # Por env y no interpolado en el `run`: el token no queda escrito en el comando.
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -u
          failed=0
          for app in "backend:$COOLIFY_BACKEND_UUID" "frontend:$COOLIFY_FRONTEND_UUID"; do
            name=${app%%:*}
            uuid=${app#*:}
            body=$(mktemp)
            # `curl -sf` descartaba estado y cuerpo, y dejaba "exit code 22" como único
            # dato. El cuerpo de Coolify es lo que distingue un token inválido de un uuid
            # inexistente o de la instancia caída. `--retry` solo reintenta lo transitorio
            # (timeouts y 5xx), no un 401.
            # POST y no GET: Coolify cambió el verbo de este endpoint y responde 405
            # ("This endpoint has changed to a POST request") a la forma vieja.
            status=$(curl -sS -o "$body" -w '%{http_code}' \
              --max-time 30 --retry 2 -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deploy?uuid=$uuid") || status=000
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "OK  $name: Coolify aceptó el despliegue (HTTP $status)"
            else
              echo "ERR $name: Coolify respondió HTTP $status"
              head -c 500 "$body"
              echo
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Coolify rechazó al menos un despliegue. Revisá COOLIFY_TOKEN, los UUID y que la instancia responda."
            exit 1
          fi
