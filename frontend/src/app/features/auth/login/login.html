<div class="min-h-screen bg-background flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-surface-container-lowest rounded-2xl ambient-shadow-md p-8">
    <div class="flex flex-col items-start gap-1 mb-stack-lg">
      <img src="/mayahelp-logo.png" alt="MayaHelp" class="h-10 w-auto" />
      <p class="text-body-sm text-on-surface-variant">Soporte Técnico</p>
    </div>

    <h2 class="text-headline-xl text-on-surface mb-1">Bienvenido de nuevo</h2>
    <p class="text-body-md text-on-surface-variant mb-stack-lg">Inicia sesión para continuar.</p>

    <form (ngSubmit)="submit()" class="flex flex-col gap-stack-md">
      <div>
        <label class="block text-label-md text-on-background mb-stack-sm" for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          [(ngModel)]="email"
          class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
          placeholder="tu@correo.com"
        />
      </div>
      <div>
        <label class="block text-label-md text-on-background mb-stack-sm" for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="8"
          [(ngModel)]="password"
          class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
          placeholder="••••••••"
        />
      </div>

      @if (error()) {
        <p class="text-body-sm text-error">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-primary-container text-on-primary text-label-md py-3 px-4 rounded-lg hover:bg-primary transition-colors shadow-sm disabled:opacity-60"
      >
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="text-body-sm text-on-surface-variant mt-stack-lg text-center">
      ¿No tienes cuenta?
      <a routerLink="/register" class="text-primary font-medium hover:underline">Regístrate</a>
    </p>
  </div>
</div>
