<div class="min-h-screen bg-background flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-surface-container-lowest rounded-2xl ambient-shadow-md p-8">
    <div class="flex flex-col items-start gap-1 mb-stack-lg">
      <img src="/mayahelp-logo.png" alt="MayaHelp" class="h-10 w-auto" />
      <p class="text-body-sm text-on-surface-variant">Soporte Técnico</p>
    </div>

    <h2 class="text-headline-xl text-on-surface mb-1">Elegí tu contraseña</h2>
    <p class="text-body-md text-on-surface-variant mb-stack-lg">
      @if (forced()) {
        Entraste con una contraseña temporal. Definí una propia para continuar.
      } @else {
        Cambiá la contraseña de tu cuenta.
      }
    </p>

    <form (ngSubmit)="submit()" class="flex flex-col gap-stack-md">
      <div>
        <label class="block text-label-md text-on-background mb-stack-sm" for="current">
          {{ forced() ? 'Contraseña temporal' : 'Contraseña actual' }}
        </label>
        <input
          id="current"
          name="current"
          type="password"
          required
          autocomplete="current-password"
          [(ngModel)]="currentPassword"
          class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
          placeholder="••••••••"
        />
      </div>

      <div>
        <label class="block text-label-md text-on-background mb-stack-sm" for="new-password">
          Contraseña nueva
        </label>
        <input
          id="new-password"
          name="new-password"
          type="password"
          required
          [minlength]="minLength"
          autocomplete="new-password"
          [(ngModel)]="newPassword"
          class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
          placeholder="••••••••"
        />
        <p class="text-body-sm text-on-surface-variant mt-stack-sm">
          Al menos {{ minLength }} caracteres.
        </p>
      </div>

      <div>
        <label class="block text-label-md text-on-background mb-stack-sm" for="confirmation">
          Repetí la contraseña nueva
        </label>
        <input
          id="confirmation"
          name="confirmation"
          type="password"
          required
          autocomplete="new-password"
          [(ngModel)]="confirmation"
          class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
          placeholder="••••••••"
        />
        @if (mismatch) {
          <p class="text-body-sm text-error mt-stack-sm">Las contraseñas no coinciden.</p>
        }
      </div>

      @if (error()) {
        <p class="text-body-sm text-error">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading() || !canSubmit"
        class="w-full bg-primary-container text-on-primary text-label-md py-3 px-4 rounded-lg hover:bg-primary transition-colors shadow-sm disabled:opacity-60"
      >
        {{ loading() ? 'Guardando...' : 'Guardar y continuar' }}
      </button>
    </form>

    <p class="text-body-sm text-on-surface-variant mt-stack-lg text-center">
      <button type="button" (click)="logout()" class="link-action">Cerrar sesión</button>
    </p>
  </div>
</div>
