<div class="flex flex-col gap-3">
  <div class="flex flex-wrap items-center gap-3">
    <label class="capture-action" title="Subir archivo" aria-label="Subir archivo">
      <span class="material-symbols-outlined text-[22px]">upload_file</span>
      <input
        type="file"
        multiple
        class="hidden"
        accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt"
        (change)="onFilesSelected($event)"
      />
    </label>

    @if (cameraSupported) {
      <button
        type="button"
        (click)="openPhoto()"
        [disabled]="opening()"
        class="capture-action"
        title="Tomar foto"
        aria-label="Tomar foto"
      >
        <span class="material-symbols-outlined text-[22px]">photo_camera</span>
      </button>
      <button
        type="button"
        (click)="openVideo()"
        [disabled]="opening()"
        class="capture-action"
        title="Grabar video"
        aria-label="Grabar video"
      >
        <span class="material-symbols-outlined text-[22px]">videocam</span>
      </button>
      <button
        type="button"
        (click)="openAudio()"
        [disabled]="opening()"
        class="capture-action"
        title="Grabar audio"
        aria-label="Grabar audio"
      >
        <span class="material-symbols-outlined text-[22px]">mic</span>
      </button>
    }

    @if (opening()) {
      <span class="material-symbols-outlined text-primary text-[22px] animate-spin">progress_activity</span>
    }
  </div>

  @if (error()) {
    <p class="text-body-sm text-error">{{ error() }}</p>
  }

  <canvas #canvas class="hidden"></canvas>
</div>

@if (mode() !== 'idle') {
  <div class="fixed inset-0 z-50 bg-black" role="dialog" aria-modal="true">
    @if (mode() === 'audio') {
      <div class="absolute inset-0 flex items-center justify-center">
        <span
          class="material-symbols-outlined text-white/90 text-[112px]"
          [class.animate-pulse]="recording()"
        >
          mic
        </span>
      </div>
    } @else {
      <video
        #videoPreview
        autoplay
        muted
        playsinline
        disablepictureinpicture
        (loadedmetadata)="onPreviewReady()"
        class="absolute inset-0 h-full w-full object-cover"
      ></video>
    }

    <div
      class="absolute inset-0 flex flex-col justify-between bg-gradient-to-b from-black/50 via-transparent to-black/60"
    >
      <div class="flex items-start justify-between gap-3 px-4 pt-[max(1rem,env(safe-area-inset-top))]">
        <button
          type="button"
          (click)="closeCapture()"
          class="capture-overlay-action"
          title="Cancelar"
          aria-label="Cancelar"
        >
          <span class="material-symbols-outlined text-[24px]">close</span>
        </button>

        @if (recording()) {
          <span
            class="flex items-center gap-2 rounded-full bg-black/50 px-3 py-1.5 text-label-md text-white backdrop-blur-sm"
          >
            <span class="h-2.5 w-2.5 rounded-full bg-error animate-pulse"></span>
            {{ elapsedLabel }}
          </span>
        }
      </div>

      <div class="flex items-center justify-center px-6 pt-6 pb-[max(2rem,env(safe-area-inset-bottom))]">
        @if (mode() === 'photo') {
          <button
            type="button"
            (click)="capturePhoto()"
            [disabled]="!previewReady()"
            class="capture-shutter"
            title="Capturar foto"
            aria-label="Capturar foto"
          >
            <span class="material-symbols-outlined text-[30px]">photo_camera</span>
          </button>
        } @else if (!recording()) {
          <button
            type="button"
            (click)="startRecording()"
            class="capture-shutter capture-shutter--record"
            title="Iniciar grabación"
            aria-label="Iniciar grabación"
          >
            <span class="material-symbols-outlined icon-fill text-[34px]">fiber_manual_record</span>
          </button>
        } @else {
          <button
            type="button"
            (click)="stopRecording()"
            class="capture-shutter capture-shutter--record"
            title="Detener grabación"
            aria-label="Detener grabación"
          >
            <span class="material-symbols-outlined icon-fill text-[30px]">stop</span>
          </button>
        }
      </div>
    </div>
  </div>
}
